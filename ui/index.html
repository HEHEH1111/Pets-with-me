<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://assets.petdex.dev; object-src 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pets with Me · 桌边伙伴</title><link rel="stylesheet" href="style.css"></head>
<body><main id="card"><header><span class="brand">Pets with Me</span><div><button id="fold" title="收起为桌宠">收起</button><button id="exit" aria-label="退出桌宠">×</button></div></header>
<div id="scene"><div class="sun"></div><div class="ridge"></div><button id="pet" title="轻触伙伴"><canvas width="192" height="208" aria-label="宠物形象"></canvas></button><div class="sceneText"><small>桌边伙伴</small><h1 id="petName">栗栗</h1></div></div>
<nav aria-label="功能"><button data-tab="chat" class="active">对话</button><button data-tab="memory">记忆册</button><button data-tab="pets">选宠物</button><button data-tab="connect">连接</button></nav>
<section id="chat"><div class="bar"><span>当前对话</span><button id="reset">新对话</button></div><div id="thread" role="log"></div><form id="sendForm"><input id="input" placeholder="和我说句话…" aria-label="聊天内容" maxlength="2000" autocomplete="off"><button class="primary" id="send">发送</button></form></section>
<section id="memory" hidden><h2>我的记忆</h2><p>保存在这台电脑上，换宠物也会保留。</p><form id="noteForm"><input id="note" maxlength="400" placeholder="一件想让我记住的事" required><button class="primary">记住</button></form><div id="memories"></div></section>
<section id="pets" hidden><h2>选择伙伴</h2><button id="original">栗栗 · 内置形象</button><p>从 Petdex 挑选，选中的形象会缓存到本机。</p><input id="filter" type="search" placeholder="按名称或作者搜索"><button id="load">浏览 Petdex 图库</button><div id="gallery"></div><button id="more" hidden>查看更多</button></section>
<section id="connect" hidden><h2>模型连接</h2><p>发送消息时，你填写的服务会收到本条消息、最近六轮对话和记忆册内容。密钥仅在本次运行中使用。</p><form id="config"><label>完整聊天接口<input type="url" id="endpoint" placeholder="https://…/v1/chat/completions" required></label><label>模型名称<input id="model" placeholder="服务商提供的模型 ID" required></label><label>API 密钥<input type="password" id="token" placeholder="按服务商要求填写" autocomplete="off"></label><button class="primary">保存连接</button></form></section>
<div id="status" role="status"></div><div id="grip" title="拖动移动">⠿</div></main><script src="app.js"></script></body></html>
